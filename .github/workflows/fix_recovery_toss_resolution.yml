name: Fix recovery toss resolution

on:
  push:
    branches:
      - feature/live-wicket-delivery-dialog-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/live-wicket-delivery-dialog-v2
      - name: Apply recovery fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/application/sync/supabase_recovery_importer.dart')
          s = p.read_text(encoding='utf-8')
          old = """    final tossTeamId = row['toss_winner_team_id'] == null
        ? null
        : _resolveSourceLocal(teams, teamSourceToSync, row['toss_winner_team_id'], row, 'team');"""
          new = """    // Older synced matches can contain a toss-winner local ID whose
    // originating team record no longer exists on the server. The match_teams
    // assignments remain authoritative, but there is no safe way to infer the
    // toss winner from an obsolete local ID. Do not let that optional field
    // prevent the completed match from being recovered.
    int? tossTeamId;
    if (row['toss_winner_team_id'] != null) {
      try {
        tossTeamId = _resolveSourceLocal(
          teams,
          teamSourceToSync,
          row['toss_winner_team_id'],
          row,
          'team',
        );
      } on StateError {
        tossTeamId = null;
      }
    }"""
          if old not in s:
              raise SystemExit('Expected toss resolution block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/application/sync/supabase_recovery_importer.dart
          git rm -f .github/workflows/fix_recovery_toss_resolution.yml
          git commit -m "Fix recovery for obsolete toss winner references [skip ci]"
          git push origin HEAD:feature/live-wicket-delivery-dialog-v2
