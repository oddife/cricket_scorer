server {
    listen 3112;
    listen [::]:3112;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web uses client-side routing. Always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Drift Web loads sqlite3.wasm directly from the application root.
    location = /sqlite3.wasm {
        default_type application/wasm;
    }

    # Avoid caching the service worker so updated app versions are detected.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
