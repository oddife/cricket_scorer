services:
  cricket-scorer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    container_name: cricket-scorer
    restart: unless-stopped
    ports:
      - "3112:3112"
