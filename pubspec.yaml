name: cricket_scorer
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/logo_nobg.png
  adaptive_icon_background: "#0B0F0B"
  adaptive_icon_foreground: assets/branding/logo_nobg.png
  min_sdk_android: 21
